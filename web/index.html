<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dulce Encargo · Repostería artesanal en RD</title>
  <meta name="description" content="Dulce Encargo: pasteles personalizados, cupcakes, postres dominicanos y dulces para cada celebración. Haz tu encargo y confírmalo por WhatsApp.">
  <meta name="theme-color" content="#FF89B5">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Dulce Encargo · Repostería artesanal">
  <meta property="og:description" content="Hecho con amor, especialmente para ti ♡ Pasteles, cupcakes y postres por encargo.">
  <meta property="og:image" content="assets/assets/images/hero/hero_cupcakes.jpg">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dulce Encargo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(#FFC4D6, #FF89B5);
      color: #fff; font-family: 'Segoe Script', 'Brush Script MT', cursive;
      transition: opacity .4s ease;
    }
    #splash h1 { margin: 0; font-size: clamp(40px, 9vw, 72px); font-weight: 700; text-shadow: 0 3px 10px rgba(244,91,149,.45); }
    #splash p { margin: 0; font: 500 15px system-ui, sans-serif; }
    #splash .dots span {
      display: inline-block; width: 10px; height: 10px; margin: 0 4px; border-radius: 50%;
      background: #fff; animation: rebote 1s infinite ease-in-out;
    }
    #splash .dots span:nth-child(2) { animation-delay: .15s; }
    #splash .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes rebote { 0%, 80%, 100% { transform: scale(.5); opacity: .5 } 40% { transform: scale(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #splash .dots span { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Cargando Dulce Encargo">
    <h1>Dulce Encargo</h1>
    <p>Hecho con amor, especialmente para ti ♡</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <noscript>Dulce Encargo necesita JavaScript para funcionar.</noscript>
  <script>
    // Oculta la pantalla de carga cuando Flutter pinta su primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
